name: Intent Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/intent/**"
      - ".github/workflows/intent-conformance.yml"
  push:
    branches: [main]
    paths:
      - "skills/intent/**"
      - ".github/workflows/intent-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intent-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Intent conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest==9.1.1
      - name: Check portable lifecycle behavior
        run: python -m pytest -q -p no:cacheprovider skills/intent/tests/test_intent_conformance.py
