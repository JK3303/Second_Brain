name: OB1 PR Follow-Ups

on:
  workflow_run:
    workflows: ["OB1 PR Gate"]
    types: [completed]

# Never execute PR code or consume PR artifacts in this privileged job.
permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  followups:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ob1-followup-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Link verified workflow result to current PR
        uses: actions/github-script@v7
        with:
          script: |
            const followup = require('./.github/scripts/gate-followup.cjs');
            await followup({ github, context, core });
